ثر في السلامة عولجت بعض البيانات محليا بالحوسبة الطرفية لتقليل زمن الاستجابة دون انتظار السحابة - السيارة ذاتية القيادة تتخذ قرارها على متنها.",tag:"مقالي"},{q:"2- قارن AR و VR؟",a:"AR الواقع المعزز: تقنية تضيف عناصر أو معلومات رقمية إلى مشهد من العالم الحقيقي - VR الواقع الافتراضي: تقنية تضع المستخدم داخل بيئة افتراضية مولدة حاسوبيا بالكامل",tag:"مقالي"},{q:"موضوعي 1- تقنية معالجة على الجهاز نفسه؟",a:"ج- الحوسبة الطرفية",tag:"موضوعي"},{q:"موضوعي 2- مفهوم AR الدقيق؟",a:"ب- تقنية تضيف عناصر أو معلومات رقمية إلى مشهد من العالم الحقيقي",tag:"موضوعي"}]},{id:"D",title:"D أداءات منزلية ثانية",items:[{q:"1- الكيوبت vs البت الكلاسيكي؟",a:"البت التقليدي يحمل حالة واحدة، أما الكيوبت qubit فيستخدم مبدأ التراكب الكمومي ليكون مزيجا من 0 و 1 في نفس الوقت - البت يحمل 0 أو 1 فقط.",tag:"مقالي"},{q:"2- كيف غيرت السحابية تقديم الموارد؟",a:"انتشرت من العقد الثاني من الألفية فصاعدا - هي تكنولوجيا المعلومات المقدمة كخدمة عبر الإنترنت لدعم تحليل البيانات الضخمة والذكاء الاصطناعي - غيرت الطريقة من امتلاك أجهزة إلى الحصول عليها كخدمة عبر الإنترنت.",tag:"مقالي"},{q:"موضوعي 1- ما يميز الكيوبت؟",a:"ب- يستخدم مبدأ التراكب الكمي ليكون مزيجا من 0 و 1 في نفس الوقت",tag:"موضوعي"},{q:"موضوعي 2- الدفع غير النقدي؟",a:"ب- دفع قيمة السلع أو الخدمات بوسائل غير نقدية مثل البطاقات أو تطبيقات الهاتف أو رموز QR",tag:"موضوعي"}]},{id:"E",title:"E التقييمات الأسبوعية - النموذج A",items:[{q:"مقالي 1- المراحل التاريخية من الأربعينيات للستينيات؟",a:"أربعينيات ستينيات ENIAC صمامات مفرغة عسكري وعلمي يملأ غرفة.",tag:"مقالي"},{q:"مقالي 2- قانون مور والتحديات؟",a:"يصف تضاعف الترانزستورات كل عامين - التحديات: استمرار التصغير يواجه تحديات هندسية وفيزيائية مثل ازدياد تيارات التسرب والتأثيرات الكمومية مثل النفق الكمومي - لذلك يعتمد تحسين الأداء أيضا على تعدد الأنوية والمعالجة المتوازية.",tag:"مقالي"},{q:"مقالي 3- عدد التحولات الخمسة مع مفهوم العمل عن بعد والتجارة الإلكترونية؟",a:"التحولات الخمسة: العمل عن بعد: نمط عمل يؤدي فيه الشخص مهامه من المنزل أو موقع آخر بعيد باستخدام الإنترنت - التجارة الإلكترونية: بيع السلع والخدما
